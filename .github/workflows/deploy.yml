# Publishes both apps to GitHub Pages in one site:
#   main  → https://USER.github.io/REPO/        (stable)
#   beta  → https://USER.github.io/REPO/beta/   (beta, VITE_CHANNEL=beta)
# Runs on every push to main, and after "Beta CI" passes on the beta branch.
# (Pages only accepts deploys started from main; workflow_run always runs from
# main, so beta changes deploy without changing any GitHub setting.)
# Optional repo variables: GOOGLE_CLIENT_ID, FEEDBACK_EMAIL.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Beta CI"]
    types: [completed]
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      VITE_FEEDBACK_EMAIL: ${{ vars.FEEDBACK_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - id: beta
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: beta
          path: beta
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Build stable (main)
        working-directory: stable
        run: npm ci && npm test && npm run build
      - name: Build beta
        if: steps.beta.outcome == 'success'
        working-directory: beta
        run: npm ci && npm test && npm run build
        env:
          VITE_CHANNEL: beta
      - name: Assemble the site
        run: |
          mkdir site
          cp -r stable/dist/. site/
          if [ -d beta/dist ]; then mkdir -p site/beta && cp -r beta/dist/. site/beta/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
