<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance Planner</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--ln:#e3e6eb;--ac:#2563eb;--ac2:#9db8f5;--ok:#15803d;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111318;--card:#1a1d24;--tx:#eceef2;--mu:#9aa1ae;--ln:#2b303a;--ac:#6ea0ff;--ac2:#3b5aa0;--ok:#4ade80;--bad:#f87171}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;padding:12px;max-width:640px}
h1{font-size:20px;margin:6px 0 2px}h2{font-size:15px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{color:var(--mu);font-size:12px;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px}.row>*{flex:1}
.big{font-size:22px;font-weight:650}.lbl{font-size:12px;color:var(--mu)}
label{font-size:12px;color:var(--mu);display:block}
input[type=number],input[type=text],select{width:100%;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx);margin-top:8px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px}
button.s{background:var(--card);color:var(--tx);border:1px solid var(--ln);padding:5px 10px;font-size:12px}
.g{border-top:1px solid var(--ln);padding:10px 0}.g:first-of-type{border-top:0}
.gh{display:flex;justify-content:space-between;gap:8px}
.bar{height:6px;background:var(--ln);border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.bk{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.cm{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--ln);margin-top:10px}.cm i{display:block;height:100%}
.lg{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0}.lg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
svg{width:100%;height:auto;display:block}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:6px}
.leg b{display:inline-block;width:10px;height:3px;margin-inline-end:5px;vertical-align:middle}
details.card>summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;list-style:none;font-weight:600}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"\25BE";color:var(--mu);font-size:12px;flex:none}
details.card:not([open])>summary::after{content:"\25B8"}
[dir=rtl] details.card:not([open])>summary::after{content:"\25C2"}
details.card[open]>summary{margin-bottom:10px}
details.card>summary h2{margin:0}
#msg{display:none}
</style>
</head>
<body>
<div class="top"><h1 data-t="title"></h1><button class="s" id="lb" onclick="setLang()"></button></div>
<div class="sub"><span id="upd"></span><button class="s" onclick="load()" data-t="reload"></button></div>
<div class="card" id="msg"></div>
<div id="app" style="display:none">
<details class="card" style="padding:16px"><summary><span><span class="lbl" data-t="post" style="display:block;font-size:13px"></span><span class="big" id="post" style="font-size:34px"></span><span style="display:block;margin-top:6px;font-weight:500;font-size:14px;color:var(--mu)"><span data-t="pre"></span> <span id="pre"></span></span></span></summary><div class="lbl" id="tax"></div></details>

<details class="card" open><summary><span class="lbl" data-t="free"></span><span class="big" id="fm"></span></summary><div class="lbl" id="fn"></div>
<div class="cm" id="cm"></div><div id="cl" style="margin-top:8px"></div></details>

<details class="card" open><summary><h2 data-t="proj"></h2></summary><div class="row" style="align-items:end;margin-bottom:8px"><div><label data-t="scl"></label><select id="sc"><option value="opt" data-t="sco"></option><option value="mod" data-t="scm" selected></option><option value="pes" data-t="scp"></option></select></div><div class="lbl" id="scn"></div></div>
<h2 id="th" style="font-size:14px;margin:0 0 6px"></h2><input type="range" id="tm" min="0" max="140" value="0" step="1" style="width:100%">
<div class="row" style="margin-top:8px"><div><div class="lbl" data-t="legPre"></div><div class="big" id="t1" style="font-size:16px"></div></div><div><div class="lbl" data-t="legPost"></div><div class="big" id="t2" style="font-size:16px"></div></div><div><div class="lbl" data-t="legFree"></div><div class="big" id="t3" style="font-size:16px;color:#16a34a"></div></div></div>
<div id="chart" dir="ltr" style="margin-top:10px"></div>
<div class="leg"><span><b style="background:var(--ac2)"></b><span data-t="legPre"></span></span><span><b style="background:var(--ac)"></b><span data-t="legPost"></span></span><span><b style="background:#16a34a"></b><span data-t="legFree"></span></span><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-inline-end:5px"></i><span data-t="legGoal"></span></span><span><i style="display:inline-block;width:10px;height:8px;background:var(--ac);opacity:.25;margin-inline-end:5px"></i><span data-t="legRet"></span></span></div></details>

<details class="card"><summary><h2 data-t="nxt"></h2></summary><div id="nx"></div></details>

<details class="card"><summary id="gs"></summary><div id="goals"></div>
<div class="row" style="margin-top:10px;align-items:end">
<div style="flex:2"><label data-t="newGoal"></label><input type="text" id="gn" data-p="name"></div>
<div><label data-t="amount"></label><input type="number" id="ga" inputmode="numeric"></div>
<div><label data-t="year"></label><input type="number" id="gy" inputmode="numeric" placeholder="2032"></div></div>
<div class="row" style="margin-top:8px;align-items:end"><div><label data-t="month"></label><select id="gmo"></select></div><div></div></div>
<label class="chk"><input type="checkbox" id="gsp" checked><span data-t="spend"></span></label>
<button style="margin-top:8px;width:100%" id="gb" onclick="addGoal()" data-t="add"></button>
<button id="sv" style="display:none;margin-top:8px;width:100%" onclick="saveGoals()"></button>
</details><div class="lbl" id="gm" style="margin:-6px 4px 12px"></div>

<details class="card"><summary><h2 data-t="pen"></h2><span class="big" id="pnS"></span></summary>
<div class="row"><div><div class="lbl" data-t="pt1"></div><div class="big" id="pn1"></div></div><div><div class="lbl" data-t="pt2"></div><div class="big" id="pn2"></div></div></div>
<div class="row" style="margin-top:8px"><div><div class="lbl" data-t="pt3"></div><div class="big" id="pn3" style="font-size:18px"></div></div><div><div class="lbl" data-t="pt4"></div><div class="big" id="pn4" style="font-size:18px"></div></div></div>
<div id="pfl" style="margin-top:8px"></div><div class="lbl" id="pn5" style="margin-top:8px"></div>
<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600;font-size:13px" data-t="pas"></summary>
<div class="row" style="margin-top:8px"><div><label data-t="pg"></label><input type="number" id="pg" step="0.1"></div><div><label data-t="ptx"></label><input type="number" id="pt"></div></div>
<div class="row" style="margin-top:8px"><div><label data-t="po"></label><input type="number" id="po" inputmode="numeric"></div><div class="lbl" data-t="pfn"></div></div></details></details>

<details class="card"><summary><h2 data-t="assum"></h2></summary><div class="row" style="align-items:end;margin-bottom:8px"><div><label data-t="ral"></label><input type="number" id="ra" inputmode="numeric"></div><div><label data-t="all"></label><input type="number" id="al" inputmode="numeric"></div></div>
<div class="row" style="align-items:center;margin-bottom:8px"><div class="lbl" id="ri"></div><div><button id="rb2" style="width:100%" onclick="saveRet()" data-t="rs2"></button></div></div>
<div class="row" style="align-items:end;margin-bottom:8px"><div><label data-t="rdl"></label><input type="number" id="rd" inputmode="numeric"></div><div><button id="rb" style="width:100%" onclick="saveRes()" data-t="rsv"></button></div></div>
<div class="row"><div><label data-t="ms"></label><input type="number" id="ms" inputmode="numeric"></div>
<div><label data-t="fc"></label><input type="number" id="fc" inputmode="numeric"></div></div>
<div class="row" style="margin-top:8px"><div><label data-t="gr"></label><input type="number" id="gr" inputmode="numeric"></div>
<div><label data-t="ir"></label><input type="number" id="ir" step="0.1"></div></div>
<div class="row" style="margin-top:8px"><div><label data-t="cg"></label><input type="number" id="cg"></div>
<div><label data-t="it"></label><input type="number" id="it"></div></div>
<label class="chk"><input type="checkbox" id="infl"><span data-t="inflc"></span></label>
<label class="chk"><input type="checkbox" id="uv" checked><span data-t="uvc"></span></label>
<div class="lbl" style="margin-top:8px" data-t="whatif"></div></details>

<details class="card"><summary id="hs"></summary><div id="hl"></div></details>

<details class="card"><summary><h2 data-t="where"></h2></summary><div id="bk"></div></details>
</div>

 var L2=lang=="he"?"he-IL":"en-GB",it=r.res.slice().sort(function(a,b){return a.k-b.k}).slice(0,3);
 $("nx").innerHTML=it.map(function(z){var g=z.g,o2=g.ret?0:1,d=new Date(2026,10+z.k+o2,1).toLocaleDateString(L2,{month:"short",year:"numeric"});
  return'<div class="g"><div class="gh"><div><b>'+esc(gname(g.n))+'</b><div class="lbl">'+(g.ret?t("retS")+' ':'')+d+' · '+t("inT")+' '+dur(z.k+o2)+'</div></div><div style="text-align:end">'+(g.ret?f(g.w)+'/'+t("mo2"):f(g.a))+'<div class="lbl '+(z.ok?"ok":"bad")+'">'+(z.ok?t("on"):t("sh")+" "+f(z.short))+'</div></div></div></div>'}).join("")||'<div class="lbl">'+t("nog")+'</div>'
}
function pensionView(){
 var p=P(),g=N("pg")/100,kEnd=Math.max(0,(BY+PA-2026)*12-10),inf=p.on?Math.pow(1+p.ir,kEnd/12):1,real=Math.pow(1+p.ir,kEnd/12);
 var pn=0,ds=0,fe=0,tb=0,own={},rows="";PFR=[];
 PF.forEach(function(fd){var gm=Math.pow(1+fd.ret/100,1/12),fm=Math.pow(1-fd.af/100,1/12),b=fd.bal,bs=[b],d1=0,f1=0;
  for(var k=1;k<=kEnd;k++){var yr=2026+Math.floor((10+k)/12);b*=gm;var fee=b*(1-fm);b-=fee;f1+=fee;
   if(fd.dep>0&&!(fd.stop&&yr>=RETY)){var d=fd.dep*Math.pow(1+g,(k-1)/12);b+=d*(1-fd.df/100);f1+=d*fd.df/100;d1+=d}bs.push(b)}
  PFR.push({f:fd,bs:bs});pn+=fd.bal;ds+=d1;fe+=f1;tb+=b;var mon=b/fd.coef;own[fd.owner]=(own[fd.owner]||0)+mon;
  rows+='<div class="g"><div class="gh"><div><b>'+esc(fd.n)+'</b><div class="lbl">'+esc(fd.owner)+' · '+f(fd.bal)+' → '+f(b/inf)+'</div></div><div style="text-align:end">'+f(mon/inf)+'<div class="lbl">/'+t("mo2")+'</div></div></div></div>'});
 var net=0,mon2=0;for(var o in own){var m=own[o];mon2+=m;net+=m-Math.max(0,m-Math.min(m,PCL)*PXE/100)*N("pt")/100}
 var oa=N("po"),al=N("al");
 $("pfl").innerHTML=rows;
 $("pn1").textContent=f(tb/inf);$("pn2").textContent=f(mon2/inf);$("pn3").textContent=f(net/inf);$("pnS").textContent=f(mon2/inf)+"/"+t("mo2");
 $("pn4").textContent=al>0?Math.round((net/real+oa)/al*100)+"%":"–";
 $("pn5").textContent=t("pnote",{n:f(pn),d:f(ds/inf),f:f(fe/inf),y:RETY<9999?RETY:BY+PA,p:PA,x:PXE,c:f(PCL),m:p.on?"":t("pnom")})
}
function render(){
 if(!loaded)return;
 RES=N("rd");$("scn").textContent=t("scf",{f:RF[$("sc").value]});$("rb").style.display=RESROW?"block":"none";
 RETY=9999;G.forEach(function(g){if(g.ret){g.w=N("al");g.y=Math.max(2027,BY+N("ra"));g.ey=BY+PA-1;g.a=g.w*12*Math.max(0,g.ey-g.y+1);RETY=g.y}});
 $("ri").textContent=t("ri",{b:BY,p:PA});
 var cg=N("cg")/100,it=N("it")/100,p=0,q=0,bk={},pe=PF.reduce(function(a,x){return a+x.bal},0);
 H.forEach(function(h){if(!inc(h))return;p+=h.val;q+=h.val-taxOf(h,h.val,h.dep,cg,it);if(h.val>0)bk[h.type]=(bk[h.type]||0)+h.val});
 $("pre").textContent=f(p);$("post").textContent=f(q);
 $("tax").textContent=t("est")+" "+f(p-q)+" · "+t("pen")+" ("+f(pe)+")";
 var p0=P(),key=[p0.cg,p0.it,p0.ms,p0.fc,p0.gr,p0.on,p0.ir,p0.rf,p0.vt,p0.vi,$("uv").checked,JSON.stringify(G),RES,H.length,Math.round(H.reduce(function(a,h){return a+h.val},0))].join("|");
 if(!CACHE||CACHE.key!=key){var sn=[],r0=sim(0,0,null,sn);r0.free=freeCurve(sn,r0.end);CACHE={key:key,sn:sn,r:r0}}
 var r=CACHE.r;freeMoney();nextView(r);pensionView();tmView();
 var o="";if(RES>0){var Lq=0;H.forEach(function(h){if(liq(h))Lq+=h.val-taxOf(h,h.val,h.dep,cg,it)});var cv=Lq>=RES;o+='<div class="g"><div class="gh"><div><b>'+esc(t("rdf"))+'</b><div class="lbl">'+f(RES)+' · '+t("resv")+'</div></div><div style="text-align:end"><span class="'+(cv?"ok":"bad")+'">'+(cv?t("cov"):t("sh")+" "+f(RES-Lq))+'</span></div></div></div>'}
 G.slice().sort(gsort).forEach(function(x){
  var y=r.res.filter(function(z){return z.g===x})[0],pc=y?Math.min(100,y.have/x.a*100):0;
  o+='<div class="g"><div class="gh"><div><b>'+esc(gname(x.n))+'</b>'+(x.pend?' <span class="lbl">'+t("ns")+'</span> <button class="s" onclick="G.splice('+G.indexOf(x)+',1);render()">'+t("rm")+'</button>':'')+'<div class="lbl">'+f(x.a)+' · '+dl(x)+(x.ret?' · '+t("age")+' '+N("ra"):'')+'</div></div><div style="text-align:end">'+
  (y?'<span class="'+(y.ok?"ok":"bad")+'">'+(y.ok?t("on"):t("sh")+" "+f(y.short))+'</span>'+(x.ret?'':'<div class="lbl">'+t("prj")+' '+f(y.have)+'</div>'):"")+
  '</div></div>'+(x.ret?'':'<label class="chk"><input type="checkbox" '+(x.sp?"checked":"")+' onchange="G['+G.indexOf(x)+'].sp=this.checked?1:0;render()">'+t("spend")+'</label>')+'<div class="bar"><i style="width:'+pc+'%"></i></div></div>'});
 $("gs").textContent=t("goals")+" ("+(G.length+(RES>0?1:0))+")";
 $("goals").innerHTML=o||'<div class="lbl">'+t("nog")+'</div>';
 var np=G.filter(function(g){return g.pend}).length;$("sv").style.display=np?"block":"none";$("sv").textContent=np==1?t("save1"):t("saveN",{n:np});
 var tt=0,k;for(k in bk)tt+=bk[k];
 $("bk").innerHTML=Object.keys(bk).map(function(k){return'<div class="bk"><span>'+esc(ty(k))+'</span><span>'+f(bk[k])+' · '+Math.round(bk[k]/tt*100)+'%</span></div>'}).join("")
}
function addGoal(){
 var n=$("gn").value.trim(),a=N("ga"),y=parseInt($("gy").value);
 if(/[\u0590-\u05FF]/.test(n)){$("gm").textContent=t("enName");return}
 if(!n||a<=0||!(y>=2026&&y<=2070)){$("gm").textContent=t("need");return}
 G.push({n:n,a:a,y:y,m:parseInt($("gmo").value)||1,sp:$("gsp").checked?1:0,pend:1});$("gmo").value="1";
 $("gn").value=$("ga").value=$("gy").value="";$("gm").textContent=t("addedH");render()
}
async function saveRes(){
 if(!RESROW||lang=="he")return;var v=N("rd");if(v<0)return;
 $("rb").disabled=true;$("gm").textContent=t("wr");
 try{await mcp.callTool(SV,"update_values",{spreadsheetId:SID,range:"Goals!C"+RESROW,values:[[v]]});$("gm").textContent=t("rsaved")}
 catch(e){$("gm").textContent=why(e)}
 $("rb").disabled=false
}
async function saveRet(){
 if(lang=="he"||!SR.retirement_age||!SR.pre_retirement_allowance_ILS)return;
 $("rb2").disabled=true;$("gm").textContent=t("wr");
 try{await mcp.callTool(SV,"update_values",{spreadsheetId:SID,range:"Settings!B"+SR.retirement_age,values:[[N("ra")]]});
  await mcp.callTool(SV,"update_values",{spreadsheetId:SID,range:"Settings!B"+SR.pre_retirement_allowance_ILS,values:[[N("al")]]});$("gm").textContent=t("rsaved2")}
 catch(e){$("gm").textContent=why(e)}
 $("rb2").disabled=false
}
async function saveGoals(){
 var P=G.filter(function(g){return g.pend});if(!P.length)return;
 var base=G.length-P.length;
 $("sv").disabled=true;$("gm").textContent=t("wr");
 try{
  await mcp.callTool(SV,"append_values",{spreadsheetId:SID,range:"Goals!A1",values:P.map(function(g,i){return["G"+(base+i+1),g.n,g.a,g.y,g.m||1,base+i+1,"Added in app",g.sp]})});
  G.forEach(function(g){delete g.pend});await load();$("gm").textContent=t("saved")
 }catch(e){$("gm").textContent=why(e)+" "+t("chk")}
 $("sv").disabled=false
}
["sc","ms","fc","gr","ir","cg","it","infl","uv","rd","ra","al","pg","pt","po"].forEach(function(i){$(i).addEventListener("input",render)});
$("tm").addEventListener("input",tmView);
try{var sl=localStorage.getItem("fp_lang");if(sl=="he"||sl=="en")lang=sl}catch(e){}
stat();load();
</script>
