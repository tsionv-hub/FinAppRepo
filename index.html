<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finance">
<meta name="referrer" content="no-referrer">
<title>Finance Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="/src/ui/style.css">
</head>
<body>
<div class="top"><h1><span data-t="title"></span> <span class="ver-top" id="verTop"></span></h1><div class="topb"><button class="s hw" id="helpBtn" data-t="hwBtn"></button><button class="s" id="lb"></button></div></div>
<div class="sheetbar" id="sheetBar" hidden><span aria-hidden="true">📄</span><select id="sheetSel"></select></div>
<div class="sub"><span id="upd"></span><button class="s" id="reload" data-t="reload" hidden></button></div>
<div class="card demo" id="demoBar" hidden><span data-t="demoBar"></span><button class="s" id="demoExit" data-t="demoExit"></button></div>
<div class="card" id="msg" hidden></div>

<!-- First run (SPEC 2): sheet link, sign-in setup, sign-in, sheet check -->
<section id="setup" hidden>
  <div class="card" id="setupSheet" hidden>
    <h2 data-t="setupT"></h2>
    <div id="savedBox" hidden>
      <label for="savedSel" data-t="savedL"></label>
      <select id="savedSel"></select>
      <button id="savedGo" style="margin-top:8px;width:100%" data-t="savedGo"></button>
      <div class="dsec" style="margin-top:16px" data-t="orNew"></div>
    </div>
    <p class="lbl" data-t="setupN"></p>
    <label for="sid" data-t="sheetL"></label>
    <input type="text" id="sid" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url">
    <label for="snick" style="margin-top:8px" data-t="nickL"></label>
    <input type="text" id="snick" maxlength="40" autocomplete="off" data-p="nickP">
    <div class="lbl bad" id="sidErr"></div>
    <button id="sidGo" style="margin-top:8px;width:100%" data-t="cont"></button>
  </div>
  <div class="card" id="setupDemo" hidden>
    <p class="lbl" data-t="demoN"></p>
    <button class="s" id="demoGo" style="width:100%;padding:9px" data-t="demoGo"></button>
  </div>
  <div class="card" id="setupClient" hidden>
    <h2 data-t="cidT"></h2>
    <p class="lbl" data-t="cidN"></p>
    <ol class="steps"><li data-t="cid1"></li><li data-t="cid2"></li><li data-t="cid3"></li><li id="cid4"></li><li id="cid5"></li><li data-t="cid6"></li></ol>
    <label for="cid" data-t="cidL"></label>
    <input type="text" id="cid" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="lbl bad" id="cidErr"></div>
    <button id="cidGo" style="margin-top:8px;width:100%" data-t="saveL"></button>
  </div>
  <div class="card" id="setupSign" hidden>
    <h2 id="signH"></h2>
    <p class="lbl" id="signP"></p>
    <button id="signIn" style="width:100%" data-t="contG"></button>
  </div>
  <div class="card" id="setupCheck" hidden>
    <h2 data-t="chkT"></h2>
    <p class="lbl" id="chkSum"></p>
    <div id="chkList"></div>
    <div class="row" style="margin-top:8px"><button class="s" id="chkAgain" data-t="chkAgain"></button><button id="openApp" data-t="openApp"></button></div>
  </div>
  <div class="card">
    <p class="lbl" data-t="tplN"></p>
    <div class="foot" style="justify-content:flex-start;margin:0"><button class="s" id="tplBtn" data-t="tpl"></button><button class="s" id="exBtn" data-t="exDl"></button><button class="s" id="setupForget" data-t="forgetAll"></button><button class="s" id="setupDiag" data-t="diag"></button><a class="fb" id="fbBtn2" data-t="fb" hidden></a></div>
  </div>
</section>

<!-- Sign-in test (step a): open with ?diag -->
<section id="diag" hidden>
  <div class="card">
    <h2 data-t="diag"></h2>
    <pre id="diagOut" class="pre"></pre>
    <div class="row" style="margin-top:8px"><button id="dPopup" data-t="dgPopup"></button><button id="dRedir" data-t="dgRedir"></button></div>
    <div class="row" style="margin-top:8px"><button id="dRead" data-t="dgRead"></button><button class="s" id="dMode"></button></div>
    <div class="row" style="margin-top:8px"><button class="s" id="dOut" data-t="dgOut"></button><button class="s" id="dBack" data-t="dgBack"></button></div>
  </div>
</section>

<div id="app" hidden>
<div class="hint" data-t="hint"></div>
<div class="infl-bar warn" id="inflBar" role="status"><span class="infl-ic" id="inflIc" aria-hidden="true">!</span><div class="infl-txt" id="inflTxt"></div><div class="infl-act"><button class="infl-btn" id="infl" aria-pressed="false"></button><button type="button" class="hq" id="inflHelp" aria-label="?">🤔</button></div></div>

<div class="grp" data-t="gQuick"></div>
<details class="card tot" id="pToday"><summary>
<span class="today-h"><span class="ttl"><span class="pi">💰</span><h2 data-t="todayT"></h2></span><button type="button" class="hq" data-help="today" aria-label="?">🤔</button></span>
<span class="today-main"><span class="lbl" data-t="legPost"></span><span class="big" id="post"></span></span>
<span class="today-stats"><span class="stat"><span class="lbl" data-t="legPre"></span><b id="pre"></b></span><span class="stat freeline"><span class="lbl" data-t="freeShort"></span><b class="free" id="fm"></b></span><span class="stat debtw" id="debtW" hidden><span class="lbl" data-t="debtL"></span><b id="debt"></b></span></span>
</summary>
<div class="lbl" id="fn"></div>
<div class="cm" id="cm"></div><div id="cl" style="margin-top:8px"></div>
<div class="lbl" id="tax" style="margin-top:12px"></div><div class="lbl" id="dcur" style="margin-top:4px"></div></details>

<details class="card" id="pProj" open><summary><span class="ttl"><span class="pi">📈</span><h2 data-t="proj"></h2></span><button type="button" class="hq" data-help="proj" aria-label="?">🤔</button></summary>
<h2 id="th" style="font-size:14px;margin:0 0 6px"></h2><input type="range" id="tm" min="0" max="140" value="0" step="1" style="width:100%">
<div class="row" style="margin-top:8px"><div><div class="lbl" data-t="legPre"></div><div class="big" id="t1" style="font-size:16px"></div></div><div><div class="lbl" data-t="legPost"></div><div class="big" id="t2" style="font-size:16px"></div></div><div><div class="lbl" data-t="legFree"></div><div class="big free" id="t3" style="font-size:16px"></div></div></div>
<div id="chart" dir="ltr" style="margin-top:10px"></div>
<div class="leg"><span><b style="background:var(--ac2)"></b><span data-t="legPre"></span></span><span><b style="background:var(--ac)"></b><span data-t="legPost"></span></span><span><b style="background:var(--free)"></b><span data-t="legFree"></span></span><span><i class="dot"></i><span data-t="legGoal"></span></span><span><i class="band"></i><span data-t="legRet"></span></span></div>
<div class="row" style="align-items:end;margin-top:12px"><div><label for="sc" data-t="scl"></label><select id="sc"><option value="opt" data-t="sco"></option><option value="mod" data-t="scm" selected></option><option value="pes" data-t="scp"></option></select></div><div class="lbl" id="scn"></div></div></details>

<div class="grp" data-t="gMoney"></div>
<details class="card" id="pHold"><summary id="hs"><span class="ttl"><span class="pi">📂</span><h2 id="hsT"></h2></span><span class="sumr lbl" id="hsK"></span><button type="button" class="hq" data-help="hold" aria-label="?">🤔</button></summary><div class="addh" data-t="byType"></div><div id="bk"></div><div class="addh" data-t="accounts" style="margin-top:14px"></div><div id="hl"></div><button type="button" class="s addb" id="hAdd" data-t="edAddB"></button><div id="ofc"></div></details>

<details class="card" id="pGoals"><summary id="gs"><span class="ttl"><span class="pi">🎯</span><h2 id="gsT"></h2></span><span class="sumr" id="gsK"></span><button type="button" class="hq" data-help="goals" aria-label="?">🤔</button></summary><div id="goals"></div>
<div class="addg"><div class="addh" data-t="newGoal"></div>
<div class="row" style="align-items:end">
<div style="flex:2"><label for="gn" data-t="name"></label><input type="text" id="gn" data-p="name"></div>
<div><label for="ga" data-t="amount"></label><input type="number" id="ga" inputmode="numeric"></div>
<div><label for="gy" data-t="year"></label><input type="number" id="gy" inputmode="numeric"></div></div>
<div class="row" style="margin-top:8px;align-items:end"><div><label for="gmo" data-t="month"></label><select id="gmo"></select></div><div></div></div>
<div class="row" style="margin-top:8px;align-items:end"><div><label for="grp" data-t="repL"></label><input type="number" id="grp" inputmode="numeric" min="0"></div><div><label for="gru" data-t="untilL"></label><input type="number" id="gru" inputmode="numeric"></div></div>
<label class="chk"><input type="checkbox" id="gsp" checked><span data-t="spend"></span></label>
<button style="margin-top:8px;width:100%" id="gb" data-t="add"></button>
<button id="sv" hidden style="margin-top:8px;width:100%"></button></div>
</details><div class="lbl" id="gm" style="margin:-6px 4px 12px"></div>

<details class="card" id="lnCard" hidden><summary><span class="ttl"><span class="pi">🏦</span><h2 id="lnS"></h2></span><span class="big bad sumr" id="lnTot"></span><button type="button" class="hq" data-help="loans" aria-label="?">🤔</button></summary><div id="lnl"></div><div class="lbl" style="margin-top:8px" data-t="lnPanelN"></div></details>

<div class="grp" data-t="gRetire"></div>
<details class="card" id="pRet"><summary><span class="ttl"><span class="pi">🏖️</span><h2 data-t="erg"></h2></span><span class="sumr" id="retK"></span><button type="button" class="hq" data-help="ret" aria-label="?">🤔</button></summary>
<div id="retBody"></div>
<div class="addg"><div class="addh" data-t="retChange"></div>
<div class="row" style="align-items:end"><div><label for="ra" data-t="ral"></label><input type="number" id="ra" inputmode="numeric"></div><div><label for="al" data-t="all"></label><input type="number" id="al" inputmode="numeric"></div></div>
<div class="lbl" id="ri" style="margin-top:8px"></div>
<button id="rb2" style="width:100%;margin-top:8px" data-t="rs2"></button></div></details>

<details class="card" id="pPen"><summary><span class="ttl"><span class="pi">👵</span><h2 data-t="pen"></h2></span><span class="big sumr" id="pnS"></span><button type="button" class="hq" data-help="pen" aria-label="?">🤔</button></summary>
<div id="pnBody">
<div class="row"><div><div class="lbl" data-t="pt1"></div><div class="big" id="pn1"></div></div><div><div class="lbl" data-t="pt2"></div><div class="big" id="pn2"></div></div></div>
<div class="row" style="margin-top:8px"><div><div class="lbl" data-t="pt3"></div><div class="big" id="pn3" style="font-size:18px"></div></div><div><div class="lbl" data-t="pt4"></div><div class="big" id="pn4" style="font-size:18px"></div></div></div>
<div id="pfl" style="margin-top:8px"></div><div class="lbl" id="pn5" style="margin-top:8px"></div>
</div><div class="lbl" id="pnNo" hidden data-t="noBirth"></div>
<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600;font-size:13px" data-t="pas"></summary>
<div class="row" style="margin-top:8px"><div><label for="pg" data-t="pg"></label><input type="number" id="pg" step="0.1"></div><div><label for="pt" data-t="ptx"></label><input type="number" id="pt" step="0.25"></div></div>
<div class="row" style="margin-top:8px"><div><label for="po" data-t="po"></label><input type="number" id="po" inputmode="numeric"></div><div class="lbl" data-t="pfn"></div></div></details></details>

<div class="grp" data-t="gSettings"></div>
<details class="card" id="pAss"><summary><span class="ttl"><span class="pi">⚙️</span><h2 data-t="assum"></h2></span><button type="button" class="hq" data-help="ass" aria-label="?">🤔</button></summary>
<div class="row" style="align-items:end;margin-bottom:8px"><div><label for="rd" data-t="rdl"></label><input type="number" id="rd" inputmode="numeric"></div><div><button id="rb" style="width:100%" data-t="rsv"></button></div></div>
<div class="row"><div><label for="ms" data-t="ms"></label><input type="number" id="ms" inputmode="numeric"></div>
<div><label for="fc" data-t="fc"></label><input type="number" id="fc" inputmode="numeric"></div></div>
<div class="row" style="margin-top:8px"><div><label for="gr" data-t="gr"></label><input type="number" id="gr" inputmode="numeric"></div>
<div><label for="ir" data-t="ir"></label><input type="number" id="ir" step="0.1"></div></div>
<div class="row" style="margin-top:8px"><div><label for="cg" data-t="cg"></label><input type="number" id="cg"></div>
<div><label for="it" data-t="it"></label><input type="number" id="it"></div></div>
<label class="chk"><input type="checkbox" id="uv" checked><span data-t="uvc"></span></label>
<div class="lbl" style="margin-top:8px" data-t="whatif"></div></details>

<div class="fbrow"><a class="fb" id="fbBtn" data-t="fb" hidden></a><span class="lbl" id="ver"></span></div>
<div class="foot" id="foot"><button class="s" id="chgSheet" data-t="chg"></button><button class="s" id="tplBtn2" data-t="tpl"></button><button class="s" id="signOut" data-t="out"></button><button class="s" id="forget" data-t="forget"></button></div>
</div>
<dialog id="dlg" aria-labelledby="dlgT"><div class="dh"><h2 id="dlgT"></h2><button class="s" id="dlgX" data-t="close"></button></div><div id="dlgB"></div></dialog>
<button class="ai-fab" id="aiBtn" hidden data-t="aiBtn"></button>
<dialog id="aiChat" aria-labelledby="aiT"><div class="ai-head"><h2 id="aiT" data-t="aiChatT"></h2><div class="ai-hb"><button class="s" id="aiRm" data-t="aiRemove"></button><button class="s" id="aiX" data-t="close"></button></div></div>
<label class="chk ai-priv"><input type="checkbox" id="aiPriv"><span data-t="aiPriv"></span></label>
<div class="lbl ai-demo" id="aiDemo" hidden data-t="aiDemoN"></div>
<div class="ai-log" id="aiLog" aria-live="polite"></div>
<div class="ai-in"><textarea id="aiIn" rows="2" data-p="aiPh"></textarea><button id="aiSend" data-t="aiSend"></button></div>
<div class="lbl ai-foot" data-t="aiFoot"></div></dialog>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
